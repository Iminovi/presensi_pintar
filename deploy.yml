name: Deploy to GitHub Pages

on:
  # Akan berjalan setiap kali ada push ke branch "main"
  push:
    branches: ['main']

# Memberikan izin (permissions) yang dibutuhkan Action untuk men-deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Memastikan hanya ada satu proses deploy yang berjalan bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install
        
      - name: Build Project
        run: npm run build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4